<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E11D2E">
<title>캐나다쉬핑 서비스 안내</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --r:#E11D2E;--r2:#B5141F;--n:#0F1B3D;--o:#F47C42;--g:#1F7A3A;--b:#3B7BBF;
  --bg:#F7F6F2;--s:#FFFFFF;--bd:#EAE8DF;--bd2:#D5D2C6;
  --t:#1A1A1A;--t2:#5A5A5A;--t3:#8E8E8E;--k:#FAE100;--kt:#391B1B;
  --sh1:0 1px 3px rgba(15,27,61,.06);--sh2:0 6px 16px rgba(15,27,61,.09);
  --ra:16px;--ra2:12px
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.hd{padding:13px 20px 11px;display:flex;align-items:center;justify-content:space-between;background:var(--s);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--n)}
.lm{width:28px;height:28px;background:var(--r);color:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.hl{font-size:12px;color:var(--t2);font-weight:600}

.prog{display:flex;gap:4px;padding:10px 20px 3px;background:var(--s)}
.pd{flex:1;height:3px;border-radius:2px;background:var(--bd);transition:background .4s}
.pd.on{background:var(--r)}

.bk{display:inline-flex;align-items:center;gap:4px;margin:12px 20px 0;padding:6px 12px 6px 10px;background:var(--s);border:1px solid var(--bd2);border-radius:999px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.bk:hover{background:var(--bg);color:var(--t)}
.bk:active{transform:scale(.96)}

.ct{flex:1;padding:20px 20px 28px;animation:fu .3s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.wb{padding:6px 0 20px}
.em{width:50px;height:50px;margin-bottom:16px;background:linear-gradient(135deg,var(--n) 0%,#1a2954 100%);border-radius:13px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh2)}
.em svg{width:24px;height:24px;color:#fff}
.wt{font-size:22px;font-weight:800;letter-spacing:-.025em;color:var(--n);line-height:1.3;margin-bottom:6px}
.ws{font-size:13px;color:var(--t2);line-height:1.55}
.sl{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--t3);margin:0 0 9px;text-transform:uppercase}
.sl.mt{margin-top:18px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sc{background:var(--s);border:1px solid var(--bd);border-radius:var(--ra);padding:15px 13px 13px;cursor:pointer;transition:all .18s;box-shadow:var(--sh1);text-align:left;font-family:inherit;display:flex;flex-direction:column;gap:9px}
.sc:hover{border-color:var(--r);box-shadow:var(--sh2);transform:translateY(-1px)}
.sc:active{transform:scale(.97)}
.si{width:34px;height:34px;background:rgba(15,27,61,.06);border-radius:9px;display:flex;align-items:center;justify-content:center}
.si svg{width:17px;height:17px;color:var(--n)}
.sl2{font-size:13.5px;font-weight:800;color:var(--n);letter-spacing:-.015em;line-height:1.3}
.sm2{font-size:11px;color:var(--t3);font-weight:500;margin-top:1px}
.qm{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qi{background:var(--s);border:1px solid var(--bd);border-radius:var(--ra2);padding:13px 15px;cursor:pointer;transition:all .15s;box-shadow:var(--sh1);display:flex;align-items:center;gap:11px;font-family:inherit;width:100%;text-align:left}
.qi:hover{border-color:var(--r);box-shadow:var(--sh2)}
.qi:active{transform:scale(.985)}
.qi-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qi-ic.red{background:rgba(225,29,46,.08)}.qi-ic.red svg{color:var(--r)}
.qi-ic.navy{background:rgba(15,27,61,.06)}.qi-ic.navy svg{color:var(--n)}
.qi-ic svg{width:16px;height:16px}
.qi-tx{flex:1}
.qi-lb{font-size:13.5px;font-weight:700;color:var(--t);letter-spacing:-.015em}
.qi-mt{font-size:11.5px;color:var(--t3);margin-top:1px}
.qi-ar{color:var(--t3);transition:color .15s,transform .15s;flex-shrink:0}
.qi:hover .qi-ar{color:var(--r);transform:translateX(2px)}
.qi-ar svg{width:16px;height:16px}

/* QUESTION */
.ey{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--r);margin-bottom:13px;background:rgba(225,29,46,.08);padding:4px 10px;border-radius:999px}
.qq{font-size:22px;font-weight:800;letter-spacing:-.025em;color:var(--n);line-height:1.32;margin-bottom:7px}
.qs{font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{width:100%;padding:15px 17px;background:var(--s);border:1px solid var(--bd);border-radius:var(--ra);font-family:inherit;font-size:14.5px;font-weight:700;color:var(--t);text-align:left;cursor:pointer;transition:all .18s;box-shadow:var(--sh1);display:flex;align-items:center;justify-content:space-between;gap:11px;letter-spacing:-.015em}
.opt:hover{border-color:var(--r);box-shadow:var(--sh2);transform:translateY(-1px)}
.opt:active{transform:scale(.985)}
.oc{flex:1}
.om{display:block;font-size:12px;font-weight:500;color:var(--t2);margin-top:2px}
.oa{width:17px;height:17px;flex-shrink:0;color:var(--t3);transition:color .15s,transform .18s}
.opt:hover .oa{color:var(--r);transform:translateX(3px)}

/* RESULT */
.rc{background:var(--s);border-radius:19px;padding:22px 19px;box-shadow:var(--sh2);border:1px solid var(--bd);margin-bottom:13px;position:relative;overflow:hidden}
.rc::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--r)}
.rc.suc::before{background:var(--g)}.rc.wrn::before{background:var(--o)}.rc.nvy::before{background:var(--n)}.rc.inf::before{background:var(--b)}
.rb{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(31,122,58,.1);color:var(--g);border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;margin-bottom:11px}
.rb svg{width:11px;height:11px}
.rc.wrn .rb{background:rgba(244,124,66,.1);color:#C95A1F}
.rc.nvy .rb{background:rgba(15,27,61,.08);color:var(--n)}
.rc.inf .rb{background:rgba(59,123,191,.1);color:#2A5C95}
.rl{font-size:23px;font-weight:800;letter-spacing:-.028em;color:var(--n);line-height:1.22;margin-bottom:9px}
.rs{font-size:14px;color:var(--t2);line-height:1.65;margin-bottom:15px}
.it{background:var(--bg);border-radius:var(--ra2);padding:2px 13px;border:1px solid var(--bd)}
.ir{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--bd);font-size:12.5px}
.ir:last-child{border-bottom:none}
.ik{width:88px;flex-shrink:0;color:var(--t3);font-weight:600}
.iv{flex:1;color:var(--t);font-weight:700}
.wbox{background:#FFF6E5;border:1px solid #F4D58F;border-left:3px solid var(--o);border-radius:var(--ra2);padding:11px 13px;margin-top:13px;font-size:12.5px;color:#5C3D00;line-height:1.55}
.as2{background:var(--s);border:1px dashed var(--bd2);border-radius:var(--ra2);padding:11px 13px;margin-bottom:13px}
.at2{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--t3);margin-bottom:5px;text-transform:uppercase}
.arow{font-size:12px;color:var(--t2);margin-bottom:2px;display:flex;gap:7px}
.arow:last-child{margin-bottom:0}
.ak{color:var(--t3);min-width:68px}
.av{color:var(--t);font-weight:600}

/* ACTIONS */
.ac{display:flex;flex-direction:column;gap:8px}
.btn{width:100%;padding:14px 18px;border:none;border-radius:var(--ra);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;letter-spacing:-.015em}
.btn:active{transform:scale(.985)}
.bp{background:var(--r);color:#fff;box-shadow:0 2px 6px rgba(225,29,46,.25)}.bp:hover{background:var(--r2)}
.bn{background:var(--n);color:#fff}.bn:hover{background:#1a2954}
.bkk{background:var(--k);color:var(--kt)}.bkk:hover{background:#ECD400}
.bgh{background:transparent;color:var(--t2);border:1px solid var(--bd2)}.bgh:hover{background:var(--s);color:var(--t)}
.btn svg{width:16px;height:16px}
.dv{height:1px;background:var(--bd);margin:5px 0}

/* INFO */
.it2{font-size:21px;font-weight:800;letter-spacing:-.025em;color:var(--n);margin-bottom:5px}
.isub{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.55}
.lcs{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.lc{background:var(--s);border:1px solid var(--bd);border-radius:var(--ra2);padding:13px 15px}
.lch{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:7px}
.ln{font-size:13.5px;font-weight:800;color:var(--n);letter-spacing:-.01em}
.lbs{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;flex-shrink:0}
.lbg{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.la{background:rgba(59,123,191,.1);color:#2A5C95}
.lse{background:rgba(31,122,58,.1);color:var(--g)}
.lbx{background:rgba(244,124,66,.1);color:#C95A1F}
.ld{font-size:12px;color:var(--t2);line-height:1.75}
.ld span{display:block}
.bcs{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.bcard{background:var(--s);border:1px solid var(--bd);border-radius:var(--ra2);padding:14px;display:flex;align-items:center;gap:14px}
.bic{width:58px;height:58px;background:linear-gradient(135deg,#EDF2FF,#DAE5F9);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:800;color:var(--n);line-height:1.3;text-align:center}
.bnn{font-size:15px;font-weight:800;color:var(--n);margin-bottom:2px;letter-spacing:-.015em}
.bdm{font-size:13px;color:var(--t2);font-weight:600}
.bwt{font-size:11px;color:var(--t3);margin-top:2px}
.bpnote{background:var(--bg);border:1px solid var(--bd);border-radius:var(--ra2);padding:12px 13px;font-size:13px;color:var(--t2);line-height:1.75;margin-bottom:14px}

/* PRICE CALCULATOR */
.pcalc{background:var(--s);border-radius:19px;padding:22px 19px;box-shadow:var(--sh2);border:1px solid var(--bd);margin-bottom:13px;position:relative;overflow:hidden}
.pcalc::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--b)}
.pc-title{font-size:18px;font-weight:800;color:var(--n);margin-bottom:4px;letter-spacing:-.02em}
.pc-sub{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.5}
.pc-section{margin-bottom:16px}
.pc-label{font-size:11.5px;font-weight:700;color:var(--t2);margin-bottom:7px;letter-spacing:.01em}
/* Province grid */
.prov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prov-btn{padding:9px 6px;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;transition:all .15s;text-align:center}
.prov-btn:hover{border-color:var(--b);color:var(--n)}
.prov-btn.sel{background:#EDF4FF;border-color:var(--b);color:#1B4F8A}
.prov-btn.disabled{opacity:.35;cursor:not-allowed}
/* Weight input */
.wt-row{display:flex;gap:8px;align-items:center}
.wt-inp{flex:1;padding:11px 13px;background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--ra2);font-family:inherit;font-size:16px;color:var(--t);outline:none;transition:border-color .15s;-webkit-appearance:none}
.wt-inp:focus{border-color:var(--b);background:var(--s)}
.wt-unit{font-size:13px;font-weight:700;color:var(--t3)}
.wt-type{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.wt-type-btn{padding:8px;background:var(--bg);border:1.5px solid var(--bd);border-radius:9px;font-family:inherit;font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;transition:all .15s;text-align:center}
.wt-type-btn.sel{background:rgba(225,29,46,.06);border-color:var(--r);color:var(--r)}
/* Result display */
.price-result{background:linear-gradient(135deg,#0F1B3D 0%,#1a2954 100%);border-radius:14px;padding:18px 17px;margin-top:4px;display:none}
.price-result.show{display:block;animation:fu .3s ease-out}
.pr-label{font-size:11px;font-weight:700;letter-spacing:.07em;color:rgba(255,255,255,.5);margin-bottom:4px;text-transform:uppercase}
.pr-price{font-size:32px;font-weight:900;color:#fff;letter-spacing:-.03em;margin-bottom:2px}
.pr-note{font-size:11.5px;color:rgba(255,255,255,.6);line-height:1.55}
.pr-extra{background:rgba(255,255,255,.08);border-radius:9px;padding:8px 11px;margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.75);line-height:1.65}
.calc-btn{width:100%;padding:13px;background:var(--b);color:#fff;border:none;border-radius:var(--ra2);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.calc-btn:hover{background:#2A5C95}
.calc-btn:active{transform:scale(.985)}
.calc-btn svg{width:15px;height:15px}

/* Address search */
.addr-wrap{position:relative;margin-bottom:8px}
.addr-inp{width:100%;padding:11px 13px 11px 38px;background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--ra2);font-family:inherit;font-size:14px;color:var(--t);outline:none;transition:border-color .15s}
.addr-inp:focus{border-color:var(--b);background:var(--s)}
.addr-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3)}
.addr-icon svg{width:15px;height:15px}
.addr-tag{display:inline-flex;align-items:center;gap:5px;background:#EDF4FF;border:1px solid #C5D9F0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#1B4F8A;margin-top:6px}
.addr-tag svg{width:11px;height:11px}
.or-divider{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:11px;font-weight:700;color:var(--t3)}
.or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--bd)}

/* FOOTER */
.ft{padding:11px 20px 15px;border-top:1px solid var(--bd);background:var(--s);display:flex;justify-content:center}
.fl{font-size:12px;color:var(--t3);text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:500}
.fl:hover{color:var(--t2)}
.fl svg{width:13px;height:13px}

@media(max-width:380px){.wt{font-size:20px}.qq{font-size:20px}.sl2{font-size:13px}.ct{padding:17px 15px 24px}.hd{padding:12px 15px 10px}}
</style>
</head>

/* Province → phone */
function getPhone(prov){
  if(!prov) return L.tel_van;
  const g = PROV_MAP[prov] ? PROV_MAP[prov].group : 'van';
  return (g==='tor'||g==='east') ? L.tel_tor : L.tel_van;
}

/* Rate lookup */
function lookupRate(prov, weightKg, isDoc){
  const pm = PROV_MAP[prov];
  if(!pm) return null;
  let table;
  if(pm.group==='van') table = RATES_VAN;
  else if(pm.group==='west') table = RATES_WEST;
  else if(pm.group==='east') table = RATES_EAST;
  else if(pm.group==='tor') table = RATES_TOR;
  else table = RATES_VAN;

  if(isDoc){
    const row = table.find(r=>r.max===0);
    if(!row) return null;
    if(pm.group==='west'||pm.group==='east') return row[pm.col];
    return row.price;
  }
  // find first row where max >= weight
  const sorted = table.filter(r=>r.max>0).sort((a,b)=>a.max-b.max);
  const row = sorted.find(r=>weightKg <= r.max);
  if(!row) return null;
  if(pm.group==='west'||pm.group==='east') return row[pm.col];
  return row.price;
}

/* ===== STATE ===== */
let hist=[],ans={},cur='q0';
function go(next){
  hist.push({cur,ans:Object.assign({},ans)});
  if(typeof next==='function') next=next(ans);
  cur=next; render(); window.scrollTo({top:0,behavior:'instant'});
}
function back(){
  if(!hist.length) return;
  const p=hist.pop(); cur=p.cur; ans=p.ans; render(); window.scrollTo({top:0,behavior:'instant'});
}
function restart(){
  hist=[];ans={};cur='q0'; render(); window.scrollTo({top:0,behavior:'instant'});
}
function pick(opt){
  if(opt.ans) Object.assign(ans,opt.ans);
  go(opt.next);
}
function sendSheet(result,a){
  if(!L.sheet) return;
  fetch(L.sheet,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({result,timestamp:new Date().toISOString()},a))}).catch(function(){});
}

  if(href){

    a.target=href.startsWith('tel:')?'_self':'_blank';a.rel='noopener';
    a.innerHTML=icon+'<span>'+label+'</span>'; return a;
  }
  const b=document.createElement('button');
  b.className='btn '+cls;b.innerHTML=icon+'<span>'+label+'</span>';
  b.onclick=handler; return b;
}
function mkProg(p){
  const el=document.createElement('div');el.className='prog';
  for(let i=1;i<=p[1];i++){const d=document.createElement('div');d.className='pd'+(i<=p[0]?' on':'');el.appendChild(d);}

  /* Google Places Autocomplete */
  function initAutocomplete(){
    if(typeof google==='undefined'||!google.maps||!google.maps.places) return;
    const inp=document.getElementById('addr-inp');
    if(!inp) return;
    const ac2=new google.maps.places.Autocomplete(inp,{
      componentRestrictions:{country:'ca'},
      fields:['address_components']
    });
    ac2.addListener('place_changed',function(){
      const place=ac2.getPlace();
      if(!place.address_components) return;
      const provComp=place.address_components.find(c=>c.types.includes('administrative_area_level_1'));
      if(!provComp) return;
      const provCode=provComp.short_name;

      let code=provCode;
      const postalComp=place.address_components.find(c=>c.types.includes('postal_code'));
      const postal=(postalComp?postalComp.short_name:'').toUpperCase();

      // GTA: M으로 시작
      if(postal.startsWith('M')) code='GTA';
      // GVA: Metro Vancouver V5/V6/V7
      else if(provCode==='BC'&&(postal.startsWith('V5')||postal.startsWith('V6')||postal.startsWith('V7'))) code='GVA';

      if(provBtns[code]){
        selectedProv=code;
        Object.values(provBtns).forEach(b=>b.classList.remove('sel'));
        provBtns[code].classList.add('sel');
        const res2=document.getElementById('addr-result');
        if(res2){
          res2.innerHTML=`<div class="addr-tag">${IC.pin} ${PROV_MAP[code]?PROV_MAP[code].label:code} 으로 설정됨</div>`;
        }
        calcPrice();
      }
    });
  }

  /* Calc logic */
  function calcPrice(){
    const res=document.getElementById('price-result');
    const dimRes=document.getElementById('dim-result');
    if(!res) return;
    if(!selectedProv){res.classList.remove('show');return;}
    const pm=PROV_MAP[selectedProv];
    if(!pm){res.classList.remove('show');return;}

    let price=null;
    let extraNote='';
    let chargeableWeight=0;
    let usedVolume=false;

    if(isDoc){
      price=lookupRate(selectedProv,0,true);
      extraNote='서류 전용 요금입니다.';
      if(dimRes) dimRes.textContent='';
    } else {
      const actualW=parseFloat(wtInp.value)||0;
      const dW=parseFloat(document.getElementById('dim-w')&&document.getElementById('dim-w').value)||0;
      const dD=parseFloat(document.getElementById('dim-d')&&document.getElementById('dim-d').value)||0;
      const dH=parseFloat(document.getElementById('dim-h')&&document.getElementById('dim-h').value)||0;

      let volumeW=0;
      if(dW>0&&dD>0&&dH>0){
        volumeW=Math.round((dW*dD*dH/5000)*10)/10;
        if(dimRes) dimRes.innerHTML=`부피무게: <strong style="color:var(--n)">${volumeW} kg</strong>`;
      } else {
        if(dimRes) dimRes.textContent='';
        volumeW=0;
      }

      chargeableWeight=Math.max(actualW,volumeW);
      usedVolume=volumeW>actualW&&volumeW>0;

      if(!chargeableWeight||chargeableWeight<=0){res.classList.remove('show');return;}

      // GVA: 30kg 초과 별도문의
      if(pm.group==='van'&&chargeableWeight>30){
        res.classList.add('show');
        res.innerHTML=`<div class="pr-label">예상 요금</div><div class="pr-price">별도 문의</div><div class="pr-note">30kg 초과 화물은 담당자에게 문의해 주세요.</div><div class="pr-extra">📞 604-455-1000 (밴쿠버 본사)</div>`;
        return;
      }
      if(chargeableWeight>40){
        res.classList.add('show');
        res.innerHTML=`<div class="pr-label">예상 요금</div><div class="pr-price">상담 필요</div><div class="pr-note">40kg 초과 화물은 담당자 상담이 필요합니다.</div>`;
        return;
      }

      price=lookupRate(selectedProv,chargeableWeight,false);

      const extras=[];
      if(pm.group!=='van'&&chargeableWeight>=20) extras.push('20kg 이상: 통관수수료 $10 별도');
      if(selectedProv==='SK'||selectedProv==='NS'||selectedProv==='NL'||selectedProv==='PE') extras.push('제주도 배송 시 $10 추가');
      if(pm.group==='van'&&chargeableWeight>=10) extras.push('10kg 이상: 무료 픽업');
      else if(pm.group==='van'&&chargeableWeight<10) extras.push('10kg 미만: 픽업비 $20 발생');
      extraNote=extras.join(' · ')||'';
    }

    if(!price){res.classList.remove('show');return;}

    /* Delivery info by group */
    let delivery='', phone='', schedule='', weightNote='';
    if(pm.group==='van'){
      delivery='3~5일 (영업일 기준)';schedule='배송기간 기준';phone='604-455-1000 (밴쿠버)';
    } else if(pm.group==='tor'){
      delivery='입고 후 약 5~7일';schedule='매주 목요일까지 입고';phone='647-380-1000 (토론토)';
    } else if(pm.group==='east'){
      delivery='약 5~7일';schedule='매주 목요일까지 입고';phone='647-380-1000 (토론토)';
    } else if(pm.group==='west'){
      delivery='밴쿠버 도착 기준 약 1일';schedule='월~금 픽업 가능';phone='604-455-1000 (밴쿠버)';
    }

    const weightLine = isDoc
      ? '서류'
      : (usedVolume
          ? `부피무게 ${chargeableWeight}kg 적용 (실무게보다 큼)`
          : `실무게 ${chargeableWeight}kg 적용`);

    res.classList.add('show');
    res.innerHTML=`
      <div class="pr-label">예상 요금 (${pm.label})</div>
      <div class="pr-price">$${price} CAD</div>
      <div class="pr-note">${weightLine} · 배송기간 ${delivery}</div>
      <div class="pr-extra">
        ${extraNote?'ℹ️ '+extraNote+'<br>':''}
        ⛽ 유류할증료 별도 적용 중 (2026.04.06~)<br>
        📞 담당 지사: ${phone}
      </div>
    `;
  }

  /* Init Google if loaded */
  if(typeof google!=='undefined') initAutocomplete();
  else window._coshipInitAC=initAutocomplete;
}

/* ===== RENDER FUNCTIONS ===== */
function renderHome(sc){
  const ct=document.createElement('div');ct.className='ct';
  const wb=document.createElement('div');wb.className='wb';
  wb.innerHTML=`<div class="em">${IC.compass}</div><div class="wt">${sc.welcomeTitle}</div><div class="ws">${sc.welcomeSubtitle}</div>`;
  ct.appendChild(wb);
  const s1=document.createElement('div');s1.className='sl';s1.textContent='서비스 선택';ct.appendChild(s1);
  const grid=document.createElement('div');grid.className='sg';
  sc.services.forEach(function(svc){
    const c=document.createElement('button');c.className='sc';
    c.innerHTML=`<div class="si">${IC[svc.icon]}</div><div><div class="sl2">${svc.label}</div><div class="sm2">${svc.meta}</div></div>`;
    c.onclick=function(){pick(svc);}; grid.appendChild(c);
  });ct.appendChild(grid);
  const s2=document.createElement('div');s2.className='sl mt';s2.textContent='빠른 메뉴';ct.appendChild(s2);
  const qm=document.createElement('div');qm.className='qm';
  sc.quick.forEach(function(item){
    const q=document.createElement('button');q.className='qi';
    q.innerHTML=`<div class="qi-ic ${item.color}">${IC[item.icon]}</div><div class="qi-tx"><div class="qi-lb">${item.label}</div><div class="qi-mt">${item.meta}</div></div><div class="qi-ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>`;
    q.onclick=function(){pick(item);}; qm.appendChild(q);
  });ct.appendChild(qm);
  R.appendChild(ct);
}

function renderQ(sc){
  if(sc.prog) R.appendChild(mkProg(sc.prog));
  if(hist.length) R.appendChild(mkBack());
  const ct=document.createElement('div');ct.className='ct';
  if(sc.ey){const e=document.createElement('div');e.className='ey';e.textContent=sc.ey;ct.appendChild(e);}
  ct.appendChild(Object.assign(document.createElement('div'),{className:'qq',textContent:sc.q}));
  if(sc.qs) ct.appendChild(Object.assign(document.createElement('div'),{className:'qs',textContent:sc.qs}));
  const opts=document.createElement('div');opts.className='opts';
  sc.opts.forEach(function(o){
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<div class="oc"><div>${o.t}</div>${o.m?`<span class="om">${o.m}</span>`:''}</div>${IC.arrR}`;
    b.onclick=function(){if(o.ans) Object.assign(ans,o.ans);go(o.next);};
    opts.appendChild(b);
  });ct.appendChild(opts);
  R.appendChild(ct);
}

function renderR(sc,id){
  sendSheet(id,ans);
  if(hist.length) R.appendChild(mkBack());
  const ct=document.createElement('div');ct.className='ct';
  const card=document.createElement('div');card.className='rc '+(sc.style||'');
  const rb=document.createElement('div');rb.className='rb';
  rb.innerHTML=IC.check+'<span>'+sc.badge+'</span>';card.appendChild(rb);
  card.appendChild(Object.assign(document.createElement('div'),{className:'rl',textContent:sc.label}));
  card.appendChild(Object.assign(document.createElement('div'),{className:'rs',textContent:sc.sum}));
  if(sc.rows&&sc.rows.length){
    const tbl=document.createElement('div');tbl.className='it';
    sc.rows.forEach(function(row){
      const r=document.createElement('div');r.className='ir';
      r.innerHTML=`<div class="ik">${row[0]}</div><div class="iv">${row[1]}</div>`;tbl.appendChild(r);
    });card.appendChild(tbl);
  }
  if(sc.warnIf&&sc.warnIf(ans)){
    card.appendChild(Object.assign(document.createElement('div'),{className:'wbox',innerHTML:'<strong>주의:</strong> '+sc.warn}));
  }
  ct.appendChild(card);
  const ansKeys=Object.keys(ans);
  if(ansKeys.length){
    const as=document.createElement('div');as.className='as2';
    as.appendChild(Object.assign(document.createElement('div'),{className:'at2',textContent:'선택한 답변 요약'}));
    ansKeys.forEach(function(k){
      const r=document.createElement('div');r.className='arow';
      r.innerHTML=`<span class="ak">${k}</span><span class="av">${ans[k]}</span>`;as.appendChild(r);
    });ct.appendChild(as);
  }
  const ac=document.createElement('div');ac.className='ac';
  if(sc.pri) ac.appendChild(mkbtn(sc.pri.kk?'bkk':'bp',sc.pri.kk?IC.kakaoI:IC.ext,sc.pri.lbl,null,sc.pri.url));
  if(sc.sec){
    const isTel=sc.sec.url&&sc.sec.url.startsWith('tel:');
    ac.appendChild(mkbtn(sc.sec.kk?'bkk':'bn',sc.sec.kk?IC.kakaoI:(isTel?IC.phone:IC.ext),sc.sec.lbl,null,sc.sec.url));
  }
  ac.appendChild(Object.assign(document.createElement('div'),{className:'dv'}));
  ac.appendChild(mkbtn('bgh',IC.home,'처음으로 돌아가기',restart));
  ct.appendChild(ac);R.appendChild(ct);
}

function renderInfo(sc){
  if(hist.length) R.appendChild(mkBack());
  const ct=document.createElement('div');ct.className='ct';
  if(sc.ey){const e=document.createElement('div');e.className='ey';e.textContent=sc.ey;ct.appendChild(e);}
  ct.appendChild(Object.assign(document.createElement('div'),{className:'it2',textContent:sc.title}));
  ct.appendChild(Object.assign(document.createElement('div'),{className:'isub',textContent:sc.sub}));

  /* 접수처 렌더 공통 함수 */
  function renderLocList(locsArr){
    const lcs=document.createElement('div');lcs.className='lcs';
    locsArr.forEach(function(loc){
      const c=document.createElement('div');c.className='lc';
      const h=document.createElement('div');h.className='lch';
      const n=document.createElement('div');n.className='ln';n.textContent=loc.name;
      const bs=document.createElement('div');bs.className='lbs';
      if(loc.air){const b=document.createElement('span');b.className='lbg la';b.textContent='항공';bs.appendChild(b);}
      if(loc.sea){const b=document.createElement('span');b.className='lbg lse';b.textContent='선박';bs.appendChild(b);}
      if(loc.box){const b=document.createElement('span');b.className='lbg lbx';b.textContent='박스구매';bs.appendChild(b);}
      h.appendChild(n);h.appendChild(bs);c.appendChild(h);
      const d=document.createElement('div');d.className='ld';
      let inner=`<span>📍 ${loc.addr}</span>`;
      if(loc.hours) inner+=`<span>🕐 ${loc.hours}</span>`;
      if(loc.contact) inner+=`<span>📞 ${loc.contact}</span>`;
      if(loc.note) inner+=`<span style="color:var(--o);font-weight:600">ℹ️ ${loc.note}</span>`;
      d.innerHTML=inner;
      c.appendChild(d);lcs.appendChild(c);
    });
    ct.appendChild(lcs);
    // Holiday note
    const note=document.createElement('div');
    note.style.cssText='font-size:11.5px;color:var(--r);text-align:center;padding:4px 0 8px;font-weight:600';
    note.textContent='Holiday, long weekend 기간 또는 접수처 사정으로 영업시간이 변경될 수 있습니다.';
    ct.appendChild(note);
  }

  if(sc.infoType==='loc_van') renderLocList(LOCS_VAN);
  if(sc.infoType==='loc_tor') renderLocList(LOCS_TOR);

  if(sc.infoType==='box'){
    const bcs=document.createElement('div');bcs.className='bcs';
    BOXES.forEach(function(b){
      const c=document.createElement('div');c.className='bcard';
      const ic=document.createElement('div');ic.className='bic';ic.innerHTML=b.weight;
      const info=document.createElement('div');
      info.innerHTML=`<div class="bnn">${b.size}</div><div class="bdm">${b.dim}</div><div class="bwt">최대 ${b.weight}</div>`;
      c.appendChild(ic);c.appendChild(info);bcs.appendChild(c);
    });ct.appendChild(bcs);
    ct.appendChild(Object.assign(document.createElement('div'),{className:'bpnote',innerHTML:'<strong>박스 구매:</strong> 개당 $5<br>본사, 로히드 택배방, 우밴유, 밴브릿지 유학원에서 구매 가능합니다.<br><br><strong>부피무게 계산:</strong> 가로 × 세로 × 높이(cm) ÷ 5000<br>실무게와 부피무게 중 큰 값을 기준으로 배송비가 책정됩니다.'}));
  }
  const ac=document.createElement('div');ac.className='ac';
  if(sc.pri) ac.appendChild(mkbtn(sc.pri.kk?'bkk':'bp',sc.pri.kk?IC.kakaoI:IC.ext,sc.pri.lbl,null,sc.pri.url));
  if(sc.sec) ac.appendChild(mkbtn(sc.sec.kk?'bkk':'bn',sc.sec.kk?IC.kakaoI:IC.ext,sc.sec.lbl,null,sc.sec.url));
  ac.appendChild(Object.assign(document.createElement('div'),{className:'dv'}));
  ac.appendChild(mkbtn('bgh',IC.home,'처음으로 돌아가기',restart));
  ct.appendChild(ac);R.appendChild(ct);
}

function render(){
  R.innerHTML='';
  const sc=S[cur];if(!sc) return;
  if(sc.type==='home') renderHome(sc);
  else if(sc.type==='q') renderQ(sc);
  else if(sc.type==='r') renderR(sc,cur);
  else if(sc.type==='info') renderInfo(sc);
  else if(sc.type==='price_calc') renderPriceCalc();
}

render();
</script>
