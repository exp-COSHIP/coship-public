<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E11D2E">
<title>캐나다쉬핑 - COSHIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --r:#E11D2E;--r2:#B5141F;--r3:#FCE9EC;
  --k:#1A1A1A;--k2:#333333;--k3:#666666;--k4:#999999;
  --w:#FFFFFF;--w2:#FAFAFA;--bd:#E5E5E5;--bd2:#EFEFEF;
  --kk:#FAE100;--kk2:#ECD400;--kkt:#391B1B;
  --sh:0 1px 3px rgba(0,0,0,.04);--sh2:0 8px 24px rgba(0,0,0,.08);
  --ra:14px;--ra2:10px
}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--w);color:var(--k);line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;letter-spacing:-.01em
}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--w)}

/* ── HEADER ── */
.hd{padding:20px 24px 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--bd2);background:var(--w)}
.logo-img{width:140px;height:auto;display:block}

/* ── MAIN CONTENT ── */
.ct{flex:1;display:flex;flex-direction:column;padding:48px 24px 32px;animation:fu .35s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── WELCOME (가운데 정렬) ── */
.wblock{text-align:center;margin-bottom:40px}
.wmark{
  display:inline-block;padding:5px 13px;
  background:var(--r);color:var(--w);
  border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.06em;margin-bottom:20px
}
.wt{
  font-size:28px;font-weight:900;color:var(--k);
  line-height:1.3;letter-spacing:-.03em;margin-bottom:14px
}
.wt .em{color:var(--r)}
.ws{
  font-size:20px;color:var(--k);line-height:1.5;
  font-weight:800;letter-spacing:-.025em
}

/* ── BIG CHOICE CARDS (왼쪽 정렬 유지) ── */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{
  display:flex;align-items:center;gap:16px;
  padding:22px 22px;background:var(--w);
  border:2px solid var(--bd);border-radius:var(--ra);
  cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1);
  font-family:inherit;text-align:left;width:100%;
  position:relative;overflow:hidden;text-decoration:none
}
.opt:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.opt:active{transform:scale(.985)}

/* 서비스 문의: 빨간 배경 / 흰 글씨 */
.opt.service{background:var(--r);border-color:var(--r)}
.opt.service:hover{background:var(--r2);border-color:var(--r2);box-shadow:0 8px 24px rgba(225,29,46,.3)}

/* 직원 상담: 노란색 카카오 테마 */
.opt.kakao{background:var(--kk);border-color:var(--kk)}
.opt.kakao:hover{background:var(--kk2);border-color:var(--kk2);box-shadow:0 8px 24px rgba(250,225,0,.35)}

.opt-ic{
  width:48px;height:48px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .22s
}
.opt.service .opt-ic{color:var(--k)}
.opt.kakao .opt-ic{color:var(--kkt)}
.opt-ic svg{width:24px;height:24px}

.opt-tx{flex:1;min-width:0}
.opt-tt{font-size:16.5px;font-weight:800;color:var(--k);letter-spacing:-.02em;margin-bottom:3px}
.opt.service .opt-tt{color:var(--w)}
.opt.kakao .opt-tt{color:var(--kkt)}
.opt-sub{font-size:12.5px;color:var(--k3);font-weight:500}
.opt.service .opt-sub{color:rgba(255,255,255,.85)}
.opt.kakao .opt-sub{color:var(--kkt);opacity:.7}

.opt-arr{color:var(--k4);transition:transform .22s,color .22s;flex-shrink:0}
.opt.service .opt-arr{color:rgba(255,255,255,.7)}
.opt.service:hover .opt-arr{color:var(--w);transform:translateX(4px)}
.opt.kakao .opt-arr{color:var(--kkt);opacity:.5}
.opt.kakao:hover .opt-arr{opacity:1;transform:translateX(4px)}
.opt-arr svg{width:18px;height:18px}

/* ── 직원 상담 풀너비 버튼 ── */
.staff-section{margin-top:16px}
.staff-label{
  font-size:11px;font-weight:700;color:var(--k4);
  letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:10px;text-align:center
}
.staff-btns{display:flex;flex-direction:column;gap:10px}
.sbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:18px;
  border:none;border-radius:var(--ra);
  font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;transition:all .18s;
  text-decoration:none;letter-spacing:-.015em
}
.sbtn:active{transform:scale(.985)}
.sbtn svg{width:18px;height:18px}
.sbtn-rd{background:var(--r);color:var(--w)}
.sbtn-rd:hover{background:var(--r2);box-shadow:0 6px 16px rgba(225,29,46,.3)}
.sbtn-kk{background:var(--kk);color:var(--kkt)}
.sbtn-kk:hover{background:var(--kk2);box-shadow:0 6px 16px rgba(250,225,0,.3)}
.sbtn-nv{background:#0F1B3D;color:var(--w)}
.sbtn-nv:hover{background:#1a2954;box-shadow:0 6px 16px rgba(15,27,61,.25)}

/* ── CONNECT ── */
.minfo{margin-top:36px;text-align:center;padding-top:24px;border-top:1px solid var(--bd2)}
.minfo-t{font-size:11px;font-weight:700;color:var(--k4);letter-spacing:.08em;margin-bottom:12px;text-transform:uppercase}
.minfo-row{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--k3);align-items:center}
.minfo-item{display:inline-flex;align-items:center;gap:6px}
.minfo-item svg{width:13px;height:13px;color:var(--k4)}
.minfo-label{color:var(--k4);font-weight:700;min-width:78px;text-align:right;letter-spacing:.04em;font-size:11.5px}
.minfo-num{color:var(--k2);font-weight:600}

/* ── FOOTER ── */
.ft{padding:14px 24px 18px;border-top:1px solid var(--bd2);background:var(--w2);text-align:center}
.ft-tx{font-size:11px;color:var(--k4);font-weight:500}

@media(max-width:380px){
  .ct{padding:40px 20px 28px}
  .wt{font-size:25px}
  .ws{font-size:13.5px}
  .wblock{margin-bottom:32px}
  .opt{padding:18px 18px;gap:14px}
  .opt-tt{font-size:15.5px}
  .opt-ic{width:44px;height:44px}
  .logo-img{width:120px}
}
</style>
</head>
